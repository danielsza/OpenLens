name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        env:
          OPENLENS_TEST_LIBRARY: ${{ github.workspace }}/Tests/Fixtures/Mini.aplibrary
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Build app icon
        run: |
          set -eux
          mkdir -p OpenLens.iconset
          swift scripts/make_icon.swift icon_1024.png 1024
          for sz in 16 32 64 128 256 512; do
            sips -z $sz $sz icon_1024.png --out OpenLens.iconset/icon_${sz}x${sz}.png
            dbl=$((sz*2))
            sips -z $dbl $dbl icon_1024.png --out OpenLens.iconset/icon_${sz}x${sz}@2x.png
          done
          cp icon_1024.png OpenLens.iconset/icon_512x512@2x.png
          iconutil -c icns OpenLens.iconset -o OpenLens.icns
      - name: Assemble OpenLens.app
        run: |
          set -eux
          BIN="$(swift build -c release --show-bin-path)"
          APP="OpenLens.app"
          VERSION="${GITHUB_REF_NAME#v}"
          SU_PUBLIC_KEY=""
          [ -f scripts/sparkle_public_key.txt ] && SU_PUBLIC_KEY="$(tr -d '[:space:]' < scripts/sparkle_public_key.txt)"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          cp "$BIN/OpenLensApp" "$APP/Contents/MacOS/OpenLens"
          cp "$BIN/openlens-cli" "$APP/Contents/MacOS/openlens-cli"
          cp OpenLens.icns "$APP/Contents/Resources/OpenLens.icns"
          SPARKLE_FW="$(find .build -type d -name "Sparkle.framework" -path "*macos*" | head -1 || true)"
          if [ -n "$SPARKLE_FW" ]; then
            cp -R "$SPARKLE_FW" "$APP/Contents/Frameworks/"
            install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP/Contents/MacOS/OpenLens" || true
          fi
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>OpenLens</string>
            <key>CFBundleDisplayName</key><string>OpenLens</string>
            <key>CFBundleIdentifier</key><string>com.openlens.app</string>
            <key>CFBundleExecutable</key><string>OpenLens</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
            <key>CFBundleIconFile</key><string>OpenLens</string>
            <key>SUFeedURL</key><string>https://github.com/danielsza/OpenLens/releases/latest/download/appcast.xml</string>
            <key>SUPublicEDKey</key><string>${SU_PUBLIC_KEY}</string>
            <key>SUEnableAutomaticChecks</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP" || true
          ditto -c -k --keepParent "$APP" "OpenLens-${GITHUB_REF_NAME}.zip"
      - name: Build appcast (Sparkle-signed update feed)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -eu
          ZIP="OpenLens-${GITHUB_REF_NAME}.zip"
          VERSION="${GITHUB_REF_NAME#v}"
          SIG_ATTR=""
          if [ -n "${SPARKLE_PRIVATE_KEY:-}" ]; then
            # Sign the archive with Ed25519 (the secret is a base64 32-byte
            # seed; the matching public key is scripts/sparkle_public_key.txt,
            # embedded in the app as SUPublicEDKey).
            python3 -m pip install --quiet pynacl \
              || python3 -m pip install --quiet --break-system-packages pynacl
            SIG_ATTR=" $(python3 - "$ZIP" <<'PY'
          import base64, os, sys
          from nacl.signing import SigningKey
          seed = base64.b64decode(os.environ["SPARKLE_PRIVATE_KEY"].strip())
          data = open(sys.argv[1], "rb").read()
          sig = SigningKey(seed).sign(data).signature
          print(f'sparkle:edSignature="{base64.b64encode(sig).decode()}" length="{len(data)}"', end="")
          PY
          )"
            echo "Signed update:$SIG_ATTR"
          else
            echo "SPARKLE_PRIVATE_KEY secret not set — publishing unsigned appcast."
            SIG_ATTR=" length=\"$(stat -f%z "$ZIP")\""
          fi
          cat > appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>OpenLens</title>
              <item>
                <title>OpenLens ${VERSION}</title>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <link>https://github.com/danielsza/OpenLens/releases</link>
                <enclosure
                  url="https://github.com/danielsza/OpenLens/releases/download/${GITHUB_REF_NAME}/OpenLens-${GITHUB_REF_NAME}.zip"
                  type="application/octet-stream"${SIG_ATTR}/>
              </item>
            </channel>
          </rss>
          XML
          cat appcast.xml
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "OpenLens ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md. First install: right-click ▸ Open (unsigned). Auto-updates via Sparkle afterwards." \
            "OpenLens-${GITHUB_REF_NAME}.zip" \
            "appcast.xml" \
            ".build/release/openlens-cli#openlens-cli"
