name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        env:
          OPENLENS_TEST_LIBRARY: ${{ github.workspace }}/Tests/Fixtures/Mini.aplibrary
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Build app icon
        run: |
          set -eux
          mkdir -p OpenLens.iconset
          swift scripts/make_icon.swift icon_1024.png 1024
          for sz in 16 32 64 128 256 512; do
            sips -z $sz $sz icon_1024.png --out OpenLens.iconset/icon_${sz}x${sz}.png
            dbl=$((sz*2))
            sips -z $dbl $dbl icon_1024.png --out OpenLens.iconset/icon_${sz}x${sz}@2x.png
          done
          cp icon_1024.png OpenLens.iconset/icon_512x512@2x.png
          iconutil -c icns OpenLens.iconset -o OpenLens.icns
      - name: Assemble OpenLens.app
        run: |
          set -eux
          BIN="$(swift build -c release --show-bin-path)"
          APP="OpenLens.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN/OpenLensApp" "$APP/Contents/MacOS/OpenLens"
          cp "$BIN/openlens-cli" "$APP/Contents/MacOS/openlens-cli"
          cp OpenLens.icns "$APP/Contents/Resources/OpenLens.icns"
          VERSION="${GITHUB_REF_NAME#v}"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>OpenLens</string>
            <key>CFBundleDisplayName</key><string>OpenLens</string>
            <key>CFBundleIdentifier</key><string>com.openlens.app</string>
            <key>CFBundleExecutable</key><string>OpenLens</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
            <key>CFBundleIconFile</key><string>OpenLens</string>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP" || true
          ditto -c -k --keepParent "$APP" "OpenLens-${GITHUB_REF_NAME}.zip"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "OpenLens ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md. Unsigned build: right-click ▸ Open on first launch, or run: xattr -dr com.apple.quarantine OpenLens.app" \
            "OpenLens-${GITHUB_REF_NAME}.zip" \
            ".build/release/openlens-cli#openlens-cli"
